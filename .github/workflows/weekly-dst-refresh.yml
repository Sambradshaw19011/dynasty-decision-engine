name: Weekly D/ST Refresh
on:
  schedule:
    - cron: "0 14 * * 2"
    - cron: "0 14 * * 5"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-dst-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyarrow
      - name: Refresh schedule and weekly player statistics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -m src.ingestion.nflverse.load_schedules --load
          python -m src.ingestion.nflverse.load_weekly_stats --load --weeks 5
      - name: Refresh PBP fumbles and D/ST scores
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PBP_INSPECT_SECRET: ${{ secrets.PBP_INSPECT_SECRET }}
          DST_SCORING_SETTINGS_ID: ${{ secrets.DST_SCORING_SETTINGS_ID }}
        run: python -m src.ingestion.nflverse.refresh_dst
