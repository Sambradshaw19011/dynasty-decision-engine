
name: Weekly NFLverse Stats Ingestion

on:
  schedule:
    # Every Thursday at 14:00 UTC (7:00 AM Pacific during standard time)
    - cron: "0 14 * * 4"

  # Allows manual runs from GitHub Actions
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-nflverse-ingestion
  cancel-in-progress: false

jobs:
  ingest-weekly-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load NFLverse weekly stats
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -m src.ingestion.nflverse.load_weekly_stats --load
